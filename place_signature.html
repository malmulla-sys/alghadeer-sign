<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>وضع التوقيع والتاريخ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        .hint {
            color: #fff;
            text-align: center;
            font-size: 14px;
            padding: 6px;
        }
        .pagebar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #fff;
            padding: 6px 0 12px;
            width: 100%;
            max-width: 500px;
        }
        .pagebar button {
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 16px 22px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            touch-action: manipulation;
        }
        #pageLabel {
            flex: 0 0 auto;
            white-space: nowrap;
            padding: 0 6px;
        }
        .pagebar button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #stage {
            position: relative;
            max-width: 100%;
            touch-action: none;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        #pageImg {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
            user-select: none;
        }
        .elHandle {
            position: absolute;
            cursor: grab;
            touch-action: none;
            outline: 2px dashed transparent;
        }
        .elHandle img {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            user-select: none;
        }
        .elHandle.dragging {
            cursor: grabbing;
            opacity: 0.85;
        }
        .elHandle.selected {
            outline-color: #38bdf8;
        }
        .toggles {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
            padding: 6px 0;
        }
        .toggles button {
            flex: 1;
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .toggles button.off {
            background: #7f1d1d;
        }
        .controls {
            display: flex;
            gap: 10px;
            padding: 10px 16px 16px;
            width: 100%;
            max-width: 500px;
        }
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-confirm {
            background: linear-gradient(135deg, #1e3a6e 0%, #2c5282 100%);
            color: #fff;
        }
        .btn-smaller, .btn-bigger {
            background: #334155;
            color: #fff;
            flex: 0 0 60px;
        }
        .status {
            color: #fff;
            text-align: center;
            padding: 16px;
            font-size: 16px;
            display: none;
        }
        .status.show { display: block; }
        .loading {
            color: #cbd5e1;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>

<div class="hint">اسحب التوقيع و/أو التاريخ لمكانهما في كل صفحة، كبّر/صغّر إذا لزم، ثم اضغط تأكيد</div>

<div id="loading" class="loading">جاري تحميل المعاينة...</div>

<div class="pagebar" id="pagebar" style="display:none;">
    <button id="prevBtn" onclick="goPage(-1)">◀ السابقة</button>
    <span id="pageLabel">صفحة 1 من 1</span>
    <button id="nextBtn" onclick="goPage(1)">التالية ▶</button>
</div>

<div id="stage" style="display:none;">
    <img id="pageImg" alt="letter page">
    <div id="handle-signature" class="elHandle" data-type="signature">
        <img src="/signature_basim.png" alt="signature">
    </div>
    <div id="handle-date" class="elHandle" data-type="date" style="display:none;">
        <img id="dateImg" alt="date">
    </div>
</div>

<div class="toggles" id="toggles" style="display:none;">
    <button id="toggleSigBtn" onclick="toggleElement('signature')">🖊️ التوقيع</button>
    <button id="toggleDateBtn" onclick="toggleElement('date')" style="display:none;">📅 التاريخ</button>
</div>

<div class="controls" id="controls" style="display:none;">
    <button class="btn btn-smaller" onclick="resizeSelected(0.9)">➖</button>
    <button class="btn btn-confirm" onclick="confirmPlacement()">✅ تأكيد كل الصفحات</button>
    <button class="btn btn-bigger" onclick="resizeSelected(1.1)">➕</button>
</div>

<div class="status" id="statusMsg"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const requestId = urlParams.get('id') || '';

const ASPECT = {
    signature: 638 / 1200,   // نسبة أبعاد صورة التوقيع الأصلية
    date: null,               // تُحسب من الصورة الفعلية بعد جلبها (تختلف حسب طول النص)
};
const DEFAULTS = {
    signature: { x_percent: 15, y_percent: 55, width_percent: 22 },
    date:      { x_percent: 8,  y_percent: 6,  width_percent: 16 },
};

let pageCount = 1;
let currentPage = 0;
let pageImages = [];      // data URIs لكل صفحة
let dateAvailable = false; // هل رفع البوت صورة تاريخ لهذا الطلب (فقط في تدفق الخطاب على المطبوعات)
let selectedType = 'signature';

// enabled[type][pageIndex] = bool ، placements[type][pageIndex] = {x_percent,y_percent,width_percent}
const enabled = { signature: [], date: [] };
const placements = { signature: [], date: [] };

function handleEl(type) {
    return document.getElementById(`handle-${type}`);
}

function layoutHandle(type) {
    const handle = handleEl(type);
    if (type === 'date' && !dateAvailable) {
        handle.style.display = 'none';
        return;
    }
    if (!enabled[type][currentPage]) {
        handle.style.display = 'none';
        return;
    }
    handle.style.display = 'block';
    const stage = document.getElementById('stage');
    const p = placements[type][currentPage];
    const aspect = ASPECT[type];
    const w = stage.clientWidth * (p.width_percent / 100);
    const h = w * aspect;
    handle.style.width = w + 'px';
    handle.style.height = h + 'px';
    handle.style.left = (stage.clientWidth * (p.x_percent / 100)) + 'px';
    handle.style.top = (stage.clientHeight * (p.y_percent / 100)) + 'px';
}

function layoutAllHandles() {
    layoutHandle('signature');
    layoutHandle('date');
}

function saveHandlePosition(type) {
    if (type === 'date' && !dateAvailable) return;
    if (!enabled[type][currentPage]) return;
    const stage = document.getElementById('stage');
    const handle = handleEl(type);
    const stageRect = stage.getBoundingClientRect();
    const handleRect = handle.getBoundingClientRect();
    if (stageRect.width === 0) return;
    placements[type][currentPage] = {
        x_percent: ((handleRect.left - stageRect.left) / stageRect.width) * 100,
        y_percent: ((handleRect.top - stageRect.top) / stageRect.height) * 100,
        width_percent: (handleRect.width / stageRect.width) * 100,
    };
}

function saveAllPositions() {
    saveHandlePosition('signature');
    saveHandlePosition('date');
}

function resizeSelected(factor) {
    const type = selectedType;
    if (type === 'date' && !dateAvailable) return;
    if (!enabled[type][currentPage]) return;
    const p = placements[type][currentPage];
    p.width_percent = Math.max(6, Math.min(60, p.width_percent * factor));
    layoutHandle(type);
}

function selectElement(type) {
    selectedType = type;
    handleEl('signature').classList.toggle('selected', type === 'signature');
    handleEl('date').classList.toggle('selected', type === 'date');
}

function updateToggleUI(type, idx) {
    const btn = document.getElementById(type === 'signature' ? 'toggleSigBtn' : 'toggleDateBtn');
    const label = type === 'signature' ? 'التوقيع' : 'التاريخ';
    const icon = type === 'signature' ? '🖊️' : '📅';
    if (enabled[type][idx]) {
        btn.textContent = `${icon} ${label}`;
        btn.classList.remove('off');
    } else {
        btn.textContent = `🚫 بدون ${label}`;
        btn.classList.add('off');
    }
}

function toggleElement(type) {
    if (type === 'date' && !dateAvailable) return;
    saveHandlePosition(type);
    enabled[type][currentPage] = !enabled[type][currentPage];
    if (enabled[type][currentPage] && !placements[type][currentPage]) {
        placements[type][currentPage] = { ...DEFAULTS[type] };
    }
    selectElement(type);
    updateToggleUI(type, currentPage);
    layoutHandle(type);
}

function updatePageUI(idx) {
    document.getElementById('pageLabel').textContent = `صفحة ${idx + 1} من ${pageCount}`;
    updateToggleUI('signature', idx);
    if (dateAvailable) updateToggleUI('date', idx);
    document.getElementById('prevBtn').disabled = (idx === 0);
    document.getElementById('nextBtn').disabled = (idx === pageCount - 1);
}

function showPage(idx) {
    currentPage = idx;
    document.getElementById('pageImg').src = pageImages[idx];
    updatePageUI(idx);
}

function goPage(delta) {
    saveAllPositions();
    const newIdx = currentPage + delta;
    if (newIdx < 0 || newIdx >= pageCount) return;
    showPage(newIdx);
}

async function fetchKey(key) {
    const resp = await fetch(`/api/get_signature?key=${encodeURIComponent(key)}`);
    const result = await resp.json();
    if (!result.success) return null;
    return result.data;
}

function loadImageAspect(src) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img.naturalHeight / img.naturalWidth);
        img.onerror = () => resolve(0.3);
        img.src = src;
    });
}

async function init() {
    if (!requestId) {
        document.getElementById('loading').textContent = 'رابط غير صالح.';
        return;
    }
    try {
        const first = await fetchKey(`letter_img:${requestId}:0`);
        if (!first) {
            document.getElementById('loading').textContent = 'تعذر تحميل المعاينة. أعد إرسال الملف من البوت.';
            return;
        }
        pageCount = first.page_count || 1;
        pageImages = [first.image_base64];

        for (let i = 1; i < pageCount; i++) {
            const pg = await fetchKey(`letter_img:${requestId}:${i}`);
            pageImages.push(pg ? pg.image_base64 : first.image_base64);
        }

        placements.signature = Array.from({ length: pageCount }, () => ({ ...DEFAULTS.signature }));
        enabled.signature = Array.from({ length: pageCount }, () => true);

        // صورة التاريخ اختيارية — تُرفع فقط من تدفق "خطاب على المطبوعات"، وليست من التوقيع المباشر
        const dateData = await fetchKey(`letter_img:${requestId}:date`);
        if (dateData) {
            dateAvailable = true;
            document.getElementById('dateImg').src = dateData.image_base64;
            ASPECT.date = await loadImageAspect(dateData.image_base64);
            placements.date = Array.from({ length: pageCount }, () => null);
            enabled.date = Array.from({ length: pageCount }, () => false);
            enabled.date[0] = true;
            placements.date[0] = { ...DEFAULTS.date };
            document.getElementById('toggleDateBtn').style.display = 'block';
        }

        const img = document.getElementById('pageImg');
        let firstLoad = true;
        img.onload = () => {
            if (firstLoad) {
                firstLoad = false;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('stage').style.display = 'block';
                document.getElementById('controls').style.display = 'flex';
                document.getElementById('toggles').style.display = 'flex';
                document.getElementById('pagebar').style.display = pageCount > 1 ? 'flex' : 'none';
                setupDrag('signature');
                if (dateAvailable) setupDrag('date');
                setupSwipe(document.getElementById('stage'));
                selectElement('signature');
            }
            layoutAllHandles();
        };
        img.src = pageImages[0];
        updatePageUI(0);
    } catch (e) {
        document.getElementById('loading').textContent = 'خطأ في الاتصال بالخادم.';
    }
}

function setupSwipe(stage) {
    let touchStartX = null;
    let touchStartTarget = null;

    stage.addEventListener('touchstart', (e) => {
        touchStartTarget = e.target;
        touchStartX = e.touches[0].clientX;
    }, { passive: true });

    stage.addEventListener('touchend', (e) => {
        const startX = touchStartX;
        const startTarget = touchStartTarget;
        touchStartX = null;
        touchStartTarget = null;

        if (startX === null) return;
        // تجاهل إذا كان اللمس بدأ على أحد المقابض (يُعامَل كسحب للعنصر لا كتنقل بين الصفحات)
        if (startTarget && startTarget.closest('.elHandle')) return;

        const endX = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : null;
        if (endX === null) return;

        const dx = endX - startX;
        if (Math.abs(dx) > 40) {
            if (dx < 0) goPage(1);   // سحب لليسار = الصفحة التالية
            else goPage(-1);        // سحب لليمين = الصفحة السابقة
        }
    }, { passive: true });
}

function setupDrag(type) {
    const handle = handleEl(type);
    const stage = document.getElementById('stage');
    let dragging = false;
    let offsetX = 0, offsetY = 0;

    function getPoint(e) {
        if (e.touches && e.touches.length) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
    }

    function start(e) {
        dragging = true;
        selectElement(type);
        handle.classList.add('dragging');
        const p = getPoint(e);
        const rect = handle.getBoundingClientRect();
        offsetX = p.x - rect.left;
        offsetY = p.y - rect.top;
        e.preventDefault();
    }

    function move(e) {
        if (!dragging) return;
        e.preventDefault();
        const p = getPoint(e);
        const stageRect = stage.getBoundingClientRect();
        let left = p.x - stageRect.left - offsetX;
        let top = p.y - stageRect.top - offsetY;
        handle.style.left = left + 'px';
        handle.style.top = top + 'px';
    }

    function end() {
        dragging = false;
        handle.classList.remove('dragging');
    }

    handle.addEventListener('mousedown', start);
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', end);

    handle.addEventListener('touchstart', start, { passive: false });
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('touchend', end);
}

function showActionControls(show) {
    const display = show ? 'flex' : 'none';
    document.getElementById('controls').style.display = display;
    document.getElementById('toggles').style.display = display;
    document.getElementById('pagebar').style.display = show ? (pageCount > 1 ? 'flex' : 'none') : 'none';
}

async function confirmPlacement() {
    saveAllPositions();
    showActionControls(false);

    function toUnitPercent(p) {
        if (!p) return null;
        return {
            x_percent: p.x_percent / 100,
            y_percent: p.y_percent / 100,
            width_percent: p.width_percent / 100,
        };
    }

    // كل صفحة: {signature: {...}|null, date: {...}|null}
    const pages = Array.from({ length: pageCount }, (_, i) => ({
        signature: enabled.signature[i] ? toUnitPercent(placements.signature[i]) : null,
        date: (dateAvailable && enabled.date[i]) ? toUnitPercent(placements.date[i]) : null,
    }));

    try {
        const resp = await fetch('/api/letter_place', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: requestId, placements: pages })
        });
        const result = await resp.json();
        const statusEl = document.getElementById('statusMsg');
        statusEl.classList.add('show');
        if (result.success) {
            statusEl.textContent = '✅ تم إرسال كل المواضع. ارجع للبوت لاستلام الملف النهائي.';
        } else {
            statusEl.textContent = '❌ حدث خطأ، حاول مرة أخرى.';
            showActionControls(true);
        }
    } catch (e) {
        const statusEl = document.getElementById('statusMsg');
        statusEl.classList.add('show');
        statusEl.textContent = '❌ فشل الاتصال بالخادم.';
        showActionControls(true);
    }
}

init();
</script>

</body>
</html>
