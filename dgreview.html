*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --green-deep:#2f8f6d;--green-mid:#3aa87e;--green-tint:rgba(58,168,126,.16);
  --gold:#d3a35a;--gold-tint:rgba(211,163,90,.16);
  --red:#e06c6c;--red-tint:rgba(224,108,108,.14);
  --bg:#13181a;--card:#1b2225;--card2:#212a2d;--text:#eceeed;--muted:#8b9694;--border:#2a3235;
  color-scheme:dark;
}
body{margin:0;background:var(--bg);font-family:"Cairo",'Tajawal',Tahoma,Arial,sans-serif;color:var(--text);-webkit-text-size-adjust:100%;font-size:15px}
button,input,textarea{font-family:inherit}
.head{background:radial-gradient(120% 140% at 15% 0%,#1c2b25 0%,var(--bg) 70%);border-bottom:1px solid var(--border);padding:calc(18px + env(safe-area-inset-top,0px)) 16px 40px;text-align:center}
.head img{height:52px;display:block;margin:0 auto 8px;opacity:.95}
.head .t{font-size:12.5px;color:var(--muted);font-weight:700}
.head h1{margin:4px 0 2px;font-family:"Reem Kufi","Cairo",sans-serif;font-size:22px;font-weight:700;color:var(--green-mid)}
.head .to{font-size:14px;font-weight:700;color:var(--gold)}
.wrap{max-width:560px;margin:-26px auto 0;padding:0 12px 130px}
.intro{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.85;color:#c5cccb}
.intro b{color:var(--text)}
.tabs{display:flex;gap:6px;margin:14px 0 10px;overflow-x:auto;padding-bottom:2px}
.tab{flex:1;min-width:max-content;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:9px 12px;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer}
.tab.on{background:var(--green-tint);color:var(--green-mid);border-color:var(--green-deep)}
.tab small{font-weight:700;opacity:.8;margin-inline-start:4px}
.search{width:100%;font-size:15px;padding:11px 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);margin-bottom:10px}
.search::placeholder{color:var(--muted)}
.ent{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:12px;overflow:hidden}
.eh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--card2);border-bottom:1px solid var(--border)}
.eh b{font-size:15.5px;color:var(--green-mid)}
.eh span{font-size:12.5px;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #222a2d}
.row:last-of-type{border-bottom:0}
.row .m{flex:1;min-width:0}
.row .nm{font-weight:800;font-size:15px;line-height:1.45}
.row .sub{font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.5}
.row .sub .ph{direction:ltr;unicode-bidi:isolate}
.qty{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:2px 9px}
.ib{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--bg);font-size:16px;cursor:pointer;flex-shrink:0;color:var(--text)}
.ib.del{color:var(--red)}
.row.gone{background:var(--red-tint)}
.row.gone .nm{text-decoration:line-through;color:var(--red)}
.row.gone .sub,.row.gone .qty{opacity:.55}
.undo{border:1px solid #6b3a35;background:var(--bg);color:var(--red);border-radius:11px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
.tag{font-size:11px;font-weight:800;border-radius:20px;padding:1px 8px;margin-inline-start:6px;white-space:nowrap;vertical-align:2px}
.tag.new{background:var(--green-tint);color:var(--green-mid)}
.tag.ed{background:var(--gold-tint);color:var(--gold)}
.tag.x{background:var(--red-tint);color:var(--red)}
.row.added{background:rgba(58,168,126,.07)}
.addb{display:block;width:100%;border:0;border-top:1px dashed var(--border);background:transparent;color:var(--green-mid);font-weight:800;font-size:14.5px;padding:12px;cursor:pointer}
.reset{display:block;width:100%;border:1px solid #6b3a35;background:var(--red-tint);color:var(--red);font-weight:800;font-size:14.5px;padding:12px;border-radius:14px;cursor:pointer;margin-top:10px}
.share{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--green-deep);background:var(--green-tint);color:var(--green-mid);font-weight:800;font-size:15px;padding:13px;border-radius:14px;cursor:pointer;margin-top:14px}
.share small{display:block;font-weight:700;font-size:12px;color:var(--muted)}
.addother{display:block;width:100%;border:1px dashed #3a4548;background:var(--card);color:var(--green-mid);font-weight:800;font-size:14.5px;padding:13px;border-radius:14px;cursor:pointer;margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:24px;font-weight:700}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(19,24,26,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:40}
.dock-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.dock .sum{flex:1;font-size:13px;font-weight:700;color:var(--muted);line-height:1.5}
.dock .sum b{color:var(--text)}
.dock .sv{font-size:11.5px;font-weight:700}
.go{border:0;background:var(--green-deep);color:#fff;font-weight:800;font-size:16px;padding:13px 18px;border-radius:13px;cursor:pointer;white-space:nowrap}
.go:disabled{opacity:.55}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{background:var(--card);border:1px solid var(--border);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:18px;color:var(--green-mid)}
.sheet .hint{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.sheet label{display:block;font-size:13.5px;font-weight:800;margin:12px 0 5px;color:#c5cccb}
.sheet input,.sheet textarea{width:100%;font-size:16px;padding:12px 13px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text)}
.sheet input:focus,.sheet textarea:focus,.search:focus{outline:none;border-color:var(--green-deep)}
.sheet .acts{display:flex;gap:8px;margin-top:18px}
.sheet .acts button{flex:1;border-radius:13px;padding:13px;font-weight:800;font-size:15.5px;cursor:pointer;border:1px solid var(--border);background:var(--card2);color:var(--text)}
.sheet .acts .pri{background:var(--green-deep);color:#fff;border-color:var(--green-deep)}
.sheet .acts .dng{color:var(--red);border-color:#6b3a35;background:var(--red-tint)}
.err{background:var(--red-tint);color:var(--red);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700;margin-top:10px}
.sumlist{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:14px;line-height:2}
.done{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:34px 22px;text-align:center}
.done .c{width:74px;height:74px;border-radius:50%;background:var(--green-tint);color:var(--green-mid);font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.done .c.bad{background:var(--red-tint);color:var(--red)}
.done h2{margin:0 0 6px;color:var(--green-mid)}
.done p{color:var(--muted);line-height:1.8;margin:0}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#0f1416;color:var(--text);border:1px solid var(--green-deep);border-radius:12px;padding:10px 18px;font-weight:700;font-size:14px;z-index:70;max-width:90vw;text-align:center}
@media (min-width:600px){.ov{align-items:center}.sheet{border-radius:20px}}
</style>
</head>
<body>
<div class="head">
  <img src="/group_logo_white.png" alt="">
  <div class="t" id="ht">مجموعة الغدير</div>
  <h1 id="h1">مراجعة كشف إهداءات التمور</h1>
  <div class="to" id="hto"></div>
</div>
<div class="wrap" id="app"><div class="intro">جارٍ التحميل…</div></div>
<div class="dock" id="dock" hidden><div class="dock-in">
  <div class="sum"><div id="sum">لا تغييرات بعد</div><div class="sv" id="sv"></div></div>
  <button class="go" id="go" onclick="confirmSend()">اعتماد وإرسال</button>
</div></div>
<script>
const T = (location.pathname.match(/\/dg\/([A-Za-z0-9_-]{20,64})/) || [])[1] || new URLSearchParams(location.search).get("t") || "";
let D = null, CH = {del: [], edit: {}, add: [], note: ""}, sec = null, q = "", saveTimer = null, sending = false;
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s || "").replace(/[ً-ْـ]/g, "").replace(/[إأآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).toLowerCase();
const digits = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
async function call(method, a, body){
  const r = await fetch("/api/dgreview?a=" + a + (method === "GET" ? "&t=" + encodeURIComponent(T) : ""),
    method === "GET" ? {cache: "no-store"} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  let j = {}; try { j = await r.json(); } catch(e){}
  if (!r.ok || !j.ok) throw new Error(j.error || "تعذّر الاتصال، حاول مرة أخرى");
  return j;
}
function fail(m){ document.getElementById("app").innerHTML = `<div class="done"><div class="c bad">!</div><h2>تعذّر فتح المراجعة</h2><p>${esc(m)}</p></div>`; }
function allItems(){ const out = []; for (const s of D.sections) for (const e of s.ents) for (const it of e.items) out.push({...it, section: s.key, ent: e.name}); return out; }
function cur(it){ return {...it, ...(CH.edit[it.id] || {})}; }
function counts(){ return {del: CH.del.length, add: CH.add.length, edit: Object.keys(CH.edit).filter(k => !CH.del.includes(+k)).length}; }
function updDock(){
  const c = counts(), n = c.del + c.add + c.edit;
  document.getElementById("sum").innerHTML = n ? `حذف <b>${c.del}</b> · إضافة <b>${c.add}</b> · تعديل <b>${c.edit}</b>` : "لا تغييرات بعد — إن كانت القائمة سليمة اضغط «اعتماد وإرسال»";
}
function queueSave(){
  updDock();
  document.getElementById("sv").textContent = "…يُحفظ";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { const j = await call("POST", "save", {t: T, changes: CH}); document.getElementById("sv").textContent = "✓ حُفظ تلقائياً " + (j.saved_at || "").slice(11); }
    catch (e) { document.getElementById("sv").textContent = "⚠️ لم يُحفظ — تحقق من الاتصال"; }
  }, 700);
}
function render(){
  const app = document.getElementById("app");
  const s = D.sections.find(x => x.key === sec) || D.sections[0]; sec = s.key;
  const qq = norm(q.trim());
  let h = `<div class="intro">نأمل مراجعة الأسماء: اضغط <b>🗑</b> لحذف اسم، و<b>✎</b> لتصحيح الاسم أو الجوال أو جهة العمل، و<b>＋ إضافة اسم</b> لإضافة شخص جديد. التغييرات تُحفظ تلقائياً، ويمكنك الخروج والعودة بالرابط نفسه. عند الانتهاء اضغط <b>اعتماد وإرسال</b>.</div>`;
  if (D.sections.length > 1) h += `<div class="tabs">` + D.sections.map(x => {
      const n = x.ents.reduce((a, e) => a + e.items.length, 0) + CH.add.filter(a => a.section === x.key).length;
      return `<button class="tab ${x.key === sec ? "on" : ""}" onclick="sec='${x.key}';render()">${esc(x.name)}<small>${n}</small></button>`; }).join("") + `</div>`;
  else h += `<div style="height:12px"></div>`;
  h += `<input class="search" type="search" placeholder="بحث باسم أو رقم…" value="${esc(q)}" oninput="q=this.value;render();this.focus();this.setSelectionRange(this.value.length,this.value.length)">`;
  const ents = s.ents.map(e => ({name: e.name, items: e.items}));
  for (const a of CH.add) if (a.section === s.key && a.via && !ents.some(e => e.name === a.via)) ents.push({name: a.via, items: []});
  let any = false;
  for (const e of ents) {
    const rows = e.items.map(cur).filter(r => !qq || norm(r.name + " " + r.phone + " " + (r.title || r.notes || "")).includes(qq));
    const adds = CH.add.map((a, i) => ({...a, i})).filter(a => a.section === s.key && a.via === e.name && (!qq || norm(a.name + " " + a.phone).includes(qq)));
    if (qq && !rows.length && !adds.length) continue;
    any = true;
    h += `<div class="ent"><div class="eh"><b>${esc(e.name)}</b><span>${e.items.length - e.items.filter(i => CH.del.includes(i.id)).length + adds.length} اسماً</span></div>`;
    for (const r of rows) {
      const gone = CH.del.includes(r.id), ed = !!CH.edit[r.id];
      const sub = [r.phone ? `<span class="ph">${esc(r.phone)}</span>` : "", esc(r.title != null ? r.title : r.notes), ed && r.via && r.via !== e.name ? "⟵ " + esc(r.via) : ""].filter(Boolean).join(" · ");
      h += `<div class="row ${gone ? "gone" : ""}"><div class="m"><div class="nm">${esc(r.name)}${gone ? `<span class="tag x">سيُحذف</span>` : ed ? `<span class="tag ed">معدّل</span>` : ""}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>
        <span class="qty">${r.qty} ${esc(D.unit || "كرتون")}</span>
        ${gone ? `<button class="undo" onclick="undel(${r.id})">تراجع</button>` : `<button class="ib" title="تعديل" onclick="editItem(${r.id})">✎</button><button class="ib del" title="حذف" onclick="del(${r.id})">🗑</button>`}</div>`;
    }
    for (const a of adds) {
      const sub = [a.phone ? `<span class="ph">${esc(a.phone)}</span>` : "", esc(a.title)].filter(Boolean).join(" · ");
      h += `<div class="row added"><div class="m"><div class="nm">${esc(a.name)}<span class="tag new">إضافة جديدة</span></div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>
        <button class="ib" title="تعديل" onclick="openAdd(${a.i})">✎</button><button class="ib del" title="إزالة" onclick="rmAdd(${a.i})">✕</button></div>`;
    }
    h += `<button class="addb" onclick="openAdd(null, '${esc(e.name).replace(/'/g, "\\'")}')">＋ إضافة اسم في ${esc(e.name)}</button></div>`;
  }
  if (!any) h += `<div class="empty">لا نتائج</div>`;
  const loose = CH.add.map((a, i) => ({...a, i})).filter(a => a.section === s.key && !a.via);
  if (loose.length) {
    h += `<div class="ent"><div class="eh"><b>إضافات بلا جهة محددة</b><span>${loose.length}</span></div>` + loose.map(a =>
      `<div class="row added"><div class="m"><div class="nm">${esc(a.name)}<span class="tag new">إضافة جديدة</span></div><div class="sub"><span class="ph">${esc(a.phone)}</span>${a.title ? " · " + esc(a.title) : ""}</div></div>
       <button class="ib" onclick="openAdd(${a.i})">✎</button><button class="ib del" onclick="rmAdd(${a.i})">✕</button></div>`).join("") + `</div>`;
  }
  h += `<button class="addother" onclick="openAdd(null, '')">＋ إضافة اسم في جهة أو قسم غير مذكور</button>`;
  const cc = counts();
  if (cc.del + cc.add + cc.edit) h += `<button class="reset" onclick="resetAll()">↺ إلغاء كل التعديلات وإعادة القائمة كما كانت</button>`;
  h += `<button class="share" onclick="shareLink()"><span>💬</span><span>إرسال الرابط لزميل ليكمل المراجعة<small>تبقى تعديلاتك محفوظة، ويكمل عليها هو ثم يعتمد</small></span></button>`;
  app.innerHTML = h;
  updDock();
}
function del(id){ if (!CH.del.includes(id)) CH.del.push(id); render(); queueSave(); }
function undel(id){ CH.del = CH.del.filter(x => x !== id); render(); queueSave(); }
function rmAdd(i){ const a = CH.add[i]; if (confirm(`إزالة «${a.name}» من الإضافات؟`)) { CH.add.splice(i, 1); render(); queueSave(); } }
function closeSheet(){ const o = document.getElementById("ov"); if (o) o.remove(); }
function sheet(html){
  closeSheet();
  const o = document.createElement("div"); o.className = "ov"; o.id = "ov";
  o.innerHTML = `<div class="sheet">${html}</div>`;
  o.addEventListener("click", e => { if (e.target === o) closeSheet(); });
  document.body.appendChild(o);
  return o;
}
function entOptions(){ const s = D.sections.find(x => x.key === sec); const names = new Set(s.ents.map(e => e.name)); CH.add.forEach(a => a.section === sec && a.via && names.add(a.via)); return [...names].map(n => `<option value="${esc(n)}">`).join(""); }
function form(v, title, hint){
  return `<h2>${title}</h2>${hint ? `<div class="hint">${hint}</div>` : ""}
    <label>الاسم <span style="color:var(--red)">*</span></label><input id="f_name" maxlength="120" value="${esc(v.name)}" autocomplete="off">
    <label>رقم الجوال</label><input id="f_phone" type="tel" inputmode="tel" dir="ltr" style="text-align:right" placeholder="05xxxxxxxx" maxlength="20" value="${esc(v.phone)}">
    <label>جهة العمل أو القسم</label><input id="f_via" list="ents" maxlength="120" value="${esc(v.via)}" autocomplete="off"><datalist id="ents">${entOptions()}</datalist>
    <label>المنصب أو الصفة <span style="color:var(--muted);font-weight:700">(اختياري)</span></label><input id="f_title" maxlength="120" value="${esc(v.title)}" autocomplete="off">
    <div class="err" id="f_err" hidden></div>`;
}
function readForm(){
  const v = {name: document.getElementById("f_name").value.trim().replace(/\s+/g, " "), phone: digits(document.getElementById("f_phone").value).replace(/[^\d+]/g, ""),
             via: document.getElementById("f_via").value.trim().replace(/\s+/g, " "), title: document.getElementById("f_title").value.trim().replace(/\s+/g, " ")};
  const er = document.getElementById("f_err");
  if (v.name.split(" ").length < 2) { er.hidden = false; er.textContent = "اكتب الاسم مع اسم العائلة"; return null; }
  if (v.phone && !/^(\+?\d{9,15})$/.test(v.phone)) { er.hidden = false; er.textContent = "رقم الجوال غير صحيح"; return null; }
  return v;
}
function openAdd(i, via){
  const a = i == null ? {name: "", phone: "", via: via || "", title: ""} : CH.add[i];
  sheet(form(a, i == null ? "إضافة اسم جديد" : "تعديل الإضافة", (D.sections.length > 1 ? "الموقع: " + esc(D.sections.find(x => x.key === sec).name) : "")) +
    `<div class="acts"><button class="pri" id="f_ok">${i == null ? "إضافة" : "حفظ"}</button><button onclick="closeSheet()">إلغاء</button></div>`);
  if (i == null) setTimeout(() => document.getElementById("f_name").focus(), 50);
  document.getElementById("f_ok").onclick = () => {
    const v = readForm(); if (!v) return;
    if (i == null) CH.add.push({k: "a" + Date.now().toString(36), section: sec, ...v}); else Object.assign(CH.add[i], v);
    closeSheet(); render(); queueSave(); if (i == null) toast("أُضيف «" + v.name + "»");
  };
}
function editItem(id){
  const it = allItems().find(x => x.id === id); const c = cur(it);
  const v = {name: c.name, phone: c.phone, via: c.via != null ? c.via : it.ent, title: c.title != null ? c.title : (it.notes || "")};
  sheet(form(v, "تصحيح البيانات", "الكمية ليست ضمن المراجعة") +
    `<div class="acts"><button class="pri" id="f_ok">حفظ</button><button onclick="closeSheet()">إلغاء</button>${CH.edit[id] ? `<button class="dng" id="f_rs">إلغاء التصحيح</button>` : ""}</div>`);
  document.getElementById("f_ok").onclick = () => {
    const n = readForm(); if (!n) return;
    const orig = {name: it.name, phone: it.phone || "", via: it.ent, title: it.notes || ""};
    const e = {}; for (const k of ["name", "phone", "via", "title"]) if (n[k] !== orig[k]) e[k] = n[k];
    if (Object.keys(e).length) CH.edit[id] = e; else delete CH.edit[id];
    closeSheet(); render(); queueSave();
  };
  const rs = document.getElementById("f_rs"); if (rs) rs.onclick = () => { delete CH.edit[id]; closeSheet(); render(); queueSave(); };
}
function resetAll(){
  const c = counts();
  if (!confirm(`إلغاء كل التعديلات (حذف ${c.del} · إضافة ${c.add} · تصحيح ${c.edit}) وإعادة القائمة كما وصلت؟`)) return;
  CH = {del: [], edit: {}, add: [], note: ""};
  render(); queueSave(); toast("أُعيدت القائمة كما كانت");
}
async function shareLink(){
  clearTimeout(saveTimer);
  try { const j = await call("POST", "save", {t: T, changes: CH}); document.getElementById("sv").textContent = "✓ حُفظ " + (j.saved_at || "").slice(11); }
  catch (e) { toast("⚠️ لم تُحفظ تعديلاتك — تحقق من الاتصال ثم أعد المحاولة"); return; }
  const url = location.origin + "/dg/" + T;
  const msg = `السلام عليكم،
أرجو إكمال مراجعة أسماء كشف إهداءات التمور لعام ${D.year} هـ (قائمة ${D.reviewer}): احذف من لا يلزم، وأضف الأسماء الجديدة بأرقامهم وجهات عملهم، ثم اضغط «اعتماد وإرسال».
${url}`;
  location.href = "https://wa.me/?text=" + encodeURIComponent(msg);
  setTimeout(() => toast("بعد إرسال الرابط أغلق الصفحة حتى لا تعدّلا في الوقت نفسه"), 800);
}
function confirmSend(){
  const c = counts();
  sheet(`<h2>اعتماد المراجعة وإرسالها</h2>
    <div class="sumlist">حذف: <b>${c.del}</b> اسماً<br>إضافة: <b>${c.add}</b> اسماً<br>تصحيح: <b>${c.edit}</b> اسماً${!(c.del + c.add + c.edit) ? "<br>— القائمة معتمدة كما هي دون تغيير" : ""}</div>
    <label>ملاحظة (اختياري)</label><textarea id="f_note" rows="3" maxlength="600">${esc(CH.note)}</textarea>
    <div class="hint" style="margin-top:8px">بعد الإرسال لا يمكن التعديل من هذا الرابط.</div>
    <div class="err" id="f_err" hidden></div>
    <div class="acts"><button class="pri" id="f_ok">اعتماد وإرسال</button><button onclick="closeSheet()">رجوع</button></div>`);
  document.getElementById("f_ok").onclick = async (ev) => {
    if (sending) return; sending = true; ev.target.disabled = true; ev.target.textContent = "…جارٍ الإرسال";
    CH.note = document.getElementById("f_note").value.trim();
    clearTimeout(saveTimer);
    try { const j = await call("POST", "submit", {t: T, changes: CH}); closeSheet(); showDone(j.submitted_at); }
    catch (e) { const er = document.getElementById("f_err"); er.hidden = false; er.textContent = e.message; ev.target.disabled = false; ev.target.textContent = "اعتماد وإرسال"; }
    sending = false;
  };
}
function showDone(at){
  document.getElementById("dock").hidden = true;
  const c = counts();
  document.getElementById("app").innerHTML = `<div class="done"><div class="c">✓</div><h2>شكراً لك، أُرسلت المراجعة</h2>
    <p>حذف ${c.del} · إضافة ${c.add} · تصحيح ${c.edit}${at ? `<br>${esc(at)}` : ""}<br>وصلت إلى المراجع وسيعتمدها في الكشف.</p></div>`;
}
(async () => {
  if (!T) return fail("الرابط ناقص.");
  try {
    D = (await call("GET", "load")).data;
    document.title = `مراجعة كشف التمور ${D.year} — ${D.reviewer}`;
    document.getElementById("ht").textContent = `مجموعة الغدير — إهداءات التمور لعام ${D.year} هـ`;
    document.getElementById("h1").textContent = D.title || "مراجعة الأسماء";
    document.getElementById("hto").textContent = "إلى: " + D.reviewer;
    if (D.changes) CH = {del: D.changes.del || [], edit: D.changes.edit || {}, add: D.changes.add || [], note: D.changes.note || ""};
    if (D.status !== "open") return showDone(D.submitted_at);
    document.getElementById("dock").hidden = false;
    render();
    if (D.saved_at) document.getElementById("sv").textContent = "آخر حفظ " + D.saved_at;
  } catch (e) { fail(e.message); }
})();
</script>
</body>
</html>
